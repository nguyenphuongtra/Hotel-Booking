services:
  api:
    image: ${DOCR_REGISTRY:?Set DOCR_REGISTRY}/${DOCR_NAMESPACE:?Set DOCR_NAMESPACE}/hotel-booking-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./backend.env
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app

  frontend:
    image: ${DOCR_REGISTRY:?Set DOCR_REGISTRY}/${DOCR_NAMESPACE:?Set DOCR_NAMESPACE}/hotel-booking-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config: